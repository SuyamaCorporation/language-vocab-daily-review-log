<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Daily Review Log</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-8 px-4">
<div class="max-w-2xl mx-auto">
  <div class="bg-white rounded-2xl shadow-lg p-8 mb-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">Vocabulary Daily Review Log</h1>
    <p class="text-gray-500 text-sm mb-5">Track new words and build your streak.</p>

    <div class="grid grid-cols-3 gap-2 mb-6">
      <div class="bg-indigo-50 rounded-xl p-4 text-center">
        <p class="text-3xl font-bold text-indigo-700" id="totalCount">0</p>
        <p class="text-xs text-gray-500 mt-1">Total Words</p>
      </div>
      <div class="bg-green-50 rounded-xl p-4 text-center">
        <p class="text-3xl font-bold text-green-700" id="streakCount">0</p>
        <p class="text-xs text-gray-500 mt-1">Day Streak</p>
      </div>
      <div class="bg-yellow-50 rounded-xl p-4 text-center">
        <p class="text-3xl font-bold text-yellow-700" id="todayCount">0</p>
        <p class="text-xs text-gray-500 mt-1">Today</p>
      </div>
    </div>

    <div class="mb-4">
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Last 7 Days</p>
      <div id="barChart" class="flex items-end gap-1 h-16"></div>
      <div id="barLabels" class="flex gap-1 mt-1"></div>
    </div>
  </div>

  <div class="bg-white rounded-2xl shadow-lg p-8 mb-6">
    <h2 class="text-lg font-semibold text-gray-700 mb-4">Add New Word</h2>
    <div class="grid grid-cols-2 gap-3 mb-3">
      <div>
        <label for="wordInput" class="block text-sm font-medium text-gray-700 mb-1">Word</label>
        <input id="wordInput" type="text" placeholder="e.g. Ephemeral"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label for="transInput" class="block text-sm font-medium text-gray-700 mb-1">Translation / Meaning</label>
        <input id="transInput" type="text" placeholder="e.g. Lasting a short time"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
    </div>
    <div class="flex gap-2">
      <button id="addBtn"
        class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2 rounded-lg transition">
        Add Word
      </button>
      <button id="exportBtn"
        class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-5 py-2 rounded-lg transition">
        Export CSV
      </button>
    </div>
  </div>

  <div class="bg-white rounded-2xl shadow-lg p-8">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-semibold text-gray-700">Word List</h2>
      <div>
        <label for="filterDate" class="text-sm text-gray-500 mr-2">Filter by date:</label>
        <input id="filterDate" type="date"
          class="border border-gray-300 rounded-lg px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
    </div>
    <div id="wordList" class="space-y-2"></div>
    <p id="emptyMsg" class="text-gray-400 text-sm text-center py-6">No words yet. Add your first word above!</p>
  </div>
</div>
<script>
const STORE_KEY = 'vocab_log_words';

function load() {
  return JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
}

function save(words) {
  localStorage.setItem(STORE_KEY, JSON.stringify(words));
}

function today() {
  return new Date().toISOString().slice(0, 10);
}

function calcStreak(words) {
  const dates = [...new Set(words.map(w => w.date))].sort().reverse();
  if (!dates.length) return 0;
  let streak = 0;
  let cur = today();
  for (let d of dates) {
    if (d === cur) {
      streak++;
      const prev = new Date(cur);
      prev.setDate(prev.getDate() - 1);
      cur = prev.toISOString().slice(0, 10);
    } else if (d < cur) {
      break;
    }
  }
  return streak;
}

function last7Days() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d.toISOString().slice(0, 10));
  }
  return days;
}

function renderChart(words) {
  const days = last7Days();
  const counts = days.map(d => words.filter(w => w.date === d).length);
  const max = Math.max(...counts, 1);
  const chart = document.getElementById('barChart');
  const labels = document.getElementById('barLabels');
  chart.innerHTML = '';
  labels.innerHTML = '';
  days.forEach((d, i) => {
    const h = Math.max(4, Math.round((counts[i] / max) * 56));
    const bar = document.createElement('div');
    bar.className = 'flex-1 rounded-t-sm ' + (d === today() ? 'bg-indigo-500' : 'bg-indigo-200');
    bar.style.height = h + 'px';
    bar.title = d + ': ' + counts[i] + ' word(s)';
    chart.appendChild(bar);

    const lbl = document.createElement('div');
    lbl.className = 'flex-1 text-center text-xs text-gray-400';
    lbl.textContent = d.slice(8);
    labels.appendChild(lbl);
  });
}

function renderWords(words, filter) {
  const list = document.getElementById('wordList');
  const empty = document.getElementById('emptyMsg');
  let filtered = filter ? words.filter(w => w.date === filter) : words;
  filtered = [...filtered].reverse();
  if (!filtered.length) {
    list.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  list.innerHTML = filtered.map(w => `
    <div class="flex items-center justify-between bg-gray-50 rounded-lg px-4 py-2 group" data-id="${w.id}">
      <div>
        <span class="font-semibold text-gray-800">${escHtml(w.word)}</span>
        <span class="text-gray-400 mx-2">—</span>
        <span class="text-gray-600">${escHtml(w.translation)}</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs text-gray-400">${w.date}</span>
        <button class="del-btn text-gray-300 hover:text-red-500 transition text-lg leading-none" data-id="${w.id}">×</button>
      </div>
    </div>`).join('');
  list.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.id);
      const words = load().filter(w => w.id !== id);
      save(words);
      refresh();
    });
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function refresh() {
  const words = load();
  document.getElementById('totalCount').textContent = words.length;
  document.getElementById('streakCount').textContent = calcStreak(words);
  document.getElementById('todayCount').textContent = words.filter(w => w.date === today()).length;
  renderChart(words);
  const filter = document.getElementById('filterDate').value;
  renderWords(words, filter);
}

document.getElementById('addBtn').addEventListener('click', () => {
  const word = document.getElementById('wordInput').value.trim();
  const translation = document.getElementById('transInput').value.trim();
  if (!word) return;
  const words = load();
  words.push({ id: Date.now(), word, translation, date: today() });
  save(words);
  document.getElementById('wordInput').value = '';
  document.getElementById('transInput').value = '';
  refresh();
});

document.getElementById('wordInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('transInput').focus();
});
document.getElementById('transInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('addBtn').click();
});

document.getElementById('filterDate').addEventListener('change', () => {
  const words = load();
  renderWords(words, document.getElementById('filterDate').value);
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const words = load();
  const rows = [['id','word','translation','date'], ...words.map(w => [w.id, w.word, w.translation, w.date])];
  const csv = rows.map(r => r.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'vocabulary_' + today() + '.csv';
  a.click();
});

refresh();
</script>
</body>
</html>
